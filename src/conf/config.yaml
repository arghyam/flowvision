log_level: "info"
file_size_limit: 10485760

app_server:
  port: 8000
  app: "routes:app"

logs:
  api_logger:
    path: "logs/api_logs"
    name: "FlowVision"
  feedback_request_logger:
    path: "logs/feedback_request_logs"
    name: "FeedbackRequest"
  extraction_request_logger:
    path: "logs/extraction_request_logs"
    name: "ExtractionRequest"

database:
  host: localhost
  port: 5432
  dbname: "flowvision"
  username: postgres
  password: postgres


# Model paths
models:
  bfm_classification: "src/models/bfm_fastai_v2"
  individual_numbers: "src/models/individual_number_recognition_yolo11l.pt"
  color_classification: "src/models/color_classification_fastai_v2"

# Minimum P(good) required to classify an image as good quality.
# Images below this threshold are classified as bad and returned as UNCLEAR.
# Sweep results on 1076 test images: 0.65 gives the best accuracy/recall balance.
# Override at deploy time (no rebuild needed) with the FLOWVISION_QUALITY_THRESHOLD
# env var, e.g. FLOWVISION_QUALITY_THRESHOLD=0.7; must be a float in [0, 1].
quality_threshold: 0.65

# Fill color for the parts of a digit crop that fall outside the detected digit
# polygon. YOLO returns oriented boxes, so a tilted digit leaves triangular
# corner regions in the axis-aligned crop that get padded with this color before
# the crop goes to the color classifier. One of: black | white.
#   black -> original behaviour; what color_classification_fastai (v1) expects.
#   white -> what color_classification_fastai_v2 expects; markedly better on
#            tilted digits, which is where v2 was regressing against v1.
# Keep this paired with models.color_classification (v1 + black, v2 + white).
# Override at deploy time (no rebuild needed) with the FLOWVISION_DIGIT_PADDING
# env var, e.g. FLOWVISION_DIGIT_PADDING=black.
digit_padding_color: white

# Image processing parameters
image_enhancement:
  clahe_clip_limit: 2.0
  clahe_tile_grid_size: [8, 8]
  sharpening_alpha: 1.5
  sharpening_beta: -0.5
  color_boost_alpha: 1.1
  color_boost_beta: 10

# Test image paths
test:
  sample_image: "dataset/data_cleaned/classification_data/Good/20240909121001_C2268402_F20918_M7711086.png"
