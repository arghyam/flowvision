log_level: "info"
file_size_limit: 10485760

app_server:
  port: 8000
  app: "routes:app"

logs:
  api_logger:
    path: "logs/api_logs"
    name: "FlowVision"
  feedback_request_logger:
    path: "logs/feedback_request_logs"
    name: "FeedbackRequest"
  extraction_request_logger:
    path: "logs/extraction_request_logs"
    name: "ExtractionRequest"

database:
  host: localhost
  port: 5432
  dbname: "flowvision"
  username: postgres
  password: postgres
  pool:
    size: 10
    max_overflow: 20
    timeout: 30
    recycle: 1800

http:
  download:
    connect_timeout_seconds: 5
    read_timeout_seconds: 10
    max_connections: 50
    max_keepalive_connections: 20

metadata:
  worker_threads: 2
  queue_maxsize: 2000


# Model paths
models:
  bfm_classification: "src/models/bfm_fastai"
  individual_numbers: "src/models/individual_number_recognition_yolo11l.pt"
  color_classification: "src/models/color_classification_fastai"
  inference_workers: 2

# Image processing parameters
image_enhancement:
  clahe_clip_limit: 2.0
  clahe_tile_grid_size: [8, 8]
  sharpening_alpha: 1.5
  sharpening_beta: -0.5
  color_boost_alpha: 1.1
  color_boost_beta: 10

# Test image paths
test:
  sample_image: "dataset/data_cleaned/classification_data/Good/20240909121001_C2268402_F20918_M7711086.png"
